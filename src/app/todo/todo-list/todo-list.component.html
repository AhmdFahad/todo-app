<div class="p-6 bg-gray-100 min-h-screen">
  <h2 class="text-2xl font-bold mb-4 text-slate-800 text-center">Todo List</h2>

  <div class="flex flex-wrap gap-6">
    <app-todo
      class="bg-white rounded-xl shadow-md p-4 w-full sm:w-[48%] md:w-[31%] transition-transform hover:scale-105"
      *ngFor="let t of todos"
      [todo]="t"
    >
    </app-todo>
  </div>
</div>
