<div class="bg-white w-auto p-4 rounded-2xl shadow-lg border border-slate-200">
  <div class="text-sm text-gray-500 mb-2">
    ID: <span class="text-gray-700 font-medium">{{ todo?.id }}</span>
  </div>
  <div class="text-lg font-semibold text-slate-800 mb-1">
    Title: {{ todo?.title }}
  </div>
  <div class="text-sm text-gray-600">
    Completed:
    <span
      [ngClass]="{
        'text-green-600 font-bold': todo?.completed,
        'text-red-500 font-bold': !todo?.completed
      }"
    >
      {{ todo?.completed ? "Yes" : "No" }}
    </span>
  </div>
</div>
